<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="Shrink, Clean, Palette, Encode, Draw"><g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle"><rect x="18" y="34" width="164" height="58" rx="9" fill="#111111" stroke="#111111" stroke-width="2.5"/><text x="100" y="70" font-size="21" font-weight="600" fill="#ffffff">Shrink</text><text x="100" y="120" font-size="15" fill="#6a6a6a">with FFmpeg, to fit</text><path d="M188 63 L210 63 M203 56 L211 63 L203 70" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="218" y="34" width="164" height="58" rx="9" fill="none" stroke="#111111" stroke-width="2.5"/><text x="300" y="70" font-size="21" font-weight="600" fill="#111111">Clean</text><text x="300" y="120" font-size="15" fill="#6a6a6a">noise out, edges kept</text><path d="M388 63 L410 63 M403 56 L411 63 L403 70" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="418" y="34" width="164" height="58" rx="9" fill="none" stroke="#111111" stroke-width="2.5"/><text x="500" y="70" font-size="21" font-weight="600" fill="#111111">Palette</text><text x="500" y="120" font-size="15" fill="#6a6a6a">24 colours, in OKLab</text><path d="M588 63 L610 63 M603 56 L611 63 L603 70" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="618" y="34" width="164" height="58" rx="9" fill="none" stroke="#111111" stroke-width="2.5"/><text x="700" y="70" font-size="21" font-weight="600" fill="#111111">Encode</text><text x="700" y="120" font-size="15" fill="#6a6a6a">one dashed line per colour</text><path d="M788 63 L810 63 M803 56 L811 63 L803 70" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="818" y="34" width="164" height="58" rx="9" fill="none" stroke="#111111" stroke-width="2.5"/><text x="900" y="